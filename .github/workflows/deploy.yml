# Urcă site-ul pe găzduire la fiecare împingere în main.
#
# Datele de conectare NU stau aici. Sunt trei secrete în GitHub, la
# Settings > Secrets and variables > Actions:
#   FTP_SERVER    adresa serverului, de pildă ftp.studiumgenerale.ro
#   FTP_USERNAME  deploy@studiumgenerale.ro
#   FTP_PASSWORD  parola contului
# Fișierul ăsta se poate citi de oricine; secretele nu se văd nici în jurnal.
name: Deploy pe găzduire

on:
  push:
    branches: [main]
  # Butonul „Run workflow" din GitHub, ca să se poată retrimite site-ul
  # fără un commit gol.
  workflow_dispatch:

# Un singur deploy o dată. Două care se suprapun ar urca fișiere din două
# versiuni diferite, amestecate.
concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Urcă prin FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # TLS explicit, pe portul 21. Cu „ftp" simplu, parola ar trece
          # necriptată prin internet la fiecare deploy. Dacă gazda nu are
          # TLS, se schimbă aici, dar atunci parola se rotește des.
          protocol: ftps
          # Unde stă site-ul pe server. Contul „deploy@" e de obicei legat
          # deja de rădăcina lui, deci „/". Dacă fișierele ajung alături de
          # site în loc de în el, se pune /public_html/ în variabila FTP_DIR,
          # la Settings > Secrets and variables > Variables. Nu e un secret,
          # deci e variabilă, nu secret.
          server-dir: ${{ vars.FTP_DIR || '/' }}
          # Acțiunea ține pe server lista fișierelor urcate, deci prima oară
          # urcă tot, iar apoi doar ce s-a schimbat. Fișierul e ascuns de
          # vizitatori din .htaccess.
          state-name: .deploy-state.json
          # Ce nu are ce căuta pe un server public. Lista înlocuiește
          # excluderile implicite ale acțiunii, deci „.git" e scris aici
          # explicit. Sursele mari (assets/video.mp4, assets/teachers/) nu
          # apar: sunt în .gitignore, deci nici nu ajung în checkout.
          # Atenție: liniile de sub „exclude" sunt tipare, nu text. Un „#" pus
          # acolo n-ar fi comentariu, ci un tipar care nu se potrivește cu
          # nimic, deci explicațiile stau aici, deasupra.
          #
          # `.htaccess` se urcă din nou, de la 2026-09-16: cel din repo
          # conține blocul pus de cPanel, cuvânt cu cuvânt, plus regulile
          # noastre sub el. Dacă cPanel își schimbă vreodată blocul din
          # MultiPHP INI Editor, se ia de pe server și se pune aici, altfel
          # deploy-ul îl dă înapoi peste schimbare.
          #
          # `admin/setup.php` și `schema.sql` se urcă o singură dată, de mână,
          # prin FTP, la fel ca `inc/config.php`, și se șterg de pe server
          # după instalare. Dacă ar pleca la fiecare deploy, pagina care
          # creează contul de administrator ar fi mereu pe server, oricine
          # ar putea s-o găsească (depozitul e public) și n-ar mai putea fi
          # ștearsă niciodată: împingerea următoare ar aduce-o înapoi.
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            inc/config.php
            admin/setup.php
            .github/**
            docs/**
            tools/**
            teste/**
            schema.sql
            CLAUDE.md
            README.md
            todo.txt
            inspo1.webp
            inspo2.webp
            vercel.json
            .vercelignore
            assets/foto/image.png
            assets/foto/clasa.jpg
            assets/foto/materii-colaj.png
